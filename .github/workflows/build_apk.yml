          cat << 'EOF' > app/src/main/java/com/abhishek/cpumaster/ShellExecutor.kt
          package com.abhishek.cpumaster

          import android.content.Context
          import android.content.pm.PackageManager
          import rikka.shizuku.Shizuku
          import java.io.BufferedReader
          import java.io.DataOutputStream
          import java.io.InputStreamReader

          object ShellExecutor {

              enum class Mode { ROOT, SHIZUKU, NONE }

              fun getAvailableMode(): Mode {
                  if (isRootAvailable()) return Mode.ROOT
                  if (isShizukuAvailable()) return Mode.SHIZUKU
                  return Mode.NONE
              }

              private fun isRootAvailable(): Boolean {
                  return try {
                      val process = Runtime.getRuntime().exec(arrayOf("su", "-c", "id"))
                      val exitCode = process.waitFor()
                      exitCode == 0
                  } catch (e: Exception) {
                      false
                  }
              }

              fun isShizukuAvailable(): Boolean {
                  return try {
                      Shizuku.pingBinder() && Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED
                  } catch (e: Exception) {
                      false
                  }
              }

              fun runCommand(cmd: String): String {
                  return when (getAvailableMode()) {
                      Mode.ROOT -> executeRoot(cmd)
                      Mode.SHIZUKU -> executeShizuku(cmd)
                      Mode.NONE -> "Error: No Root or Shizuku permission"
                  }
              }

              private fun executeRoot(cmd: String): String {
                  return try {
                      val process = Runtime.getRuntime().exec("su")
                      val os = DataOutputStream(process.outputStream)
                      os.writeBytes("$cmd\n")
                      os.writeBytes("exit\n")
                      os.flush()
                      val reader = BufferedReader(InputStreamReader(process.inputStream))
                      val output = reader.readText().trim()
                      process.waitFor()
                      output
                  } catch (e: Exception) {
                      "Root Error: ${e.message}"
                  }
              }

              private fun executeShizuku(cmd: String): String {
                  return try {
                      val process = Shizuku.newProcess(arrayOf("sh", "-c", cmd), null, null)
                      val reader = BufferedReader(InputStreamReader(process.inputStream))
                      val output = reader.readText().trim()
                      process.waitFor()
                      output
                  } catch (e: Exception) {
                      "Shizuku Error: ${e.message}"
                  }
              }

              fun getCpuInfo(): Pair<Long, Long> {
                  val maxStr = runCommand("cat /sys/devices/system/cpu/cpu0/cpufreq/cpuinfo_max_freq")
                  val minStr = runCommand("cat /sys/devices/system/cpu/cpu0/cpufreq/cpuinfo_min_freq")
                  val max = maxStr.toLongOrNull() ?: 2400000L
                  val min = minStr.toLongOrNull() ?: 300000L
                  return Pair(min, max)
              }

              fun getCurrentScalingMax(): Long {
                  val cur = runCommand("cat /sys/devices/system/cpu/cpu0/cpufreq/scaling_max_freq")
                  return cur.toLongOrNull() ?: getCpuInfo().second
              }

              fun backupDefaultsIfNeeded(context: Context) {
                  val prefs = context.getSharedPreferences("cpu_backup", Context.MODE_PRIVATE)
                  if (!prefs.contains("default_max")) {
                      val (min, max) = getCpuInfo()
                      val curMax = getCurrentScalingMax()
                      prefs.edit()
                          .putLong("default_min", min)
                          .putLong("default_max", if (curMax > 0) curMax else max)
                          .apply()
                  }
              }

              fun setCpuMaxFrequency(freqKHz: Long): String {
                  val coreCount = Runtime.getRuntime().availableProcessors()
                  val sb = StringBuilder()
                  for (i in 0 until coreCount) {
                      val path = "/sys/devices/system/cpu/cpu$i/cpufreq/scaling_max_freq"
                      sb.append("chmod 644 $path && echo $freqKHz > $path; ")
                  }
                  return runCommand(sb.toString())
              }

              fun resetCpuToBackup(context: Context): Long {
                  val prefs = context.getSharedPreferences("cpu_backup", Context.MODE_PRIVATE)
                  val savedMax = prefs.getLong("default_max", getCpuInfo().second)
                  setCpuMaxFrequency(savedMax)
                  return savedMax
              }

              fun enableUltraDeepSleep() {
                  val commands = """
                      dumpsys deviceidle force-idle
                      cmd netpolicy set restrict-background true
                      settings put global low_power 1
                      am kill-all
                  """.trimIndent()
                  runCommand(commands)
              }

              fun disableUltraDeepSleep() {
                  val commands = """
                      dumpsys deviceidle unforce
                      cmd netpolicy set restrict-background false
                      settings put global low_power 0
                  """.trimIndent()
                  runCommand(commands)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/abhishek/cpumaster/SleepReceiver.kt
          package com.abhishek.cpumaster

          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.Build

          class SleepReceiver : BroadcastReceiver() {

              override fun onReceive(context: Context, intent: Intent) {
                  val prefs = context.getSharedPreferences("cpu_backup", Context.MODE_PRIVATE)
                  val isSleepEnabled = prefs.getBoolean("sleep_enabled", false)
                  val delayMinutes = prefs.getInt("sleep_delay_mins", 10)

                  when (intent.action) {
                      Intent.ACTION_SCREEN_OFF -> {
                          if (isSleepEnabled) {
                              scheduleDeepSleep(context, delayMinutes)
                          }
                      }
                      Intent.ACTION_SCREEN_ON, Intent.ACTION_USER_PRESENT -> {
                          cancelDeepSleep(context)
                          Thread {
                              ShellExecutor.disableUltraDeepSleep()
                          }.start()
                      }
                      "ACTION_TRIGGER_DEEP_SLEEP" -> {
                          Thread {
                              ShellExecutor.enableUltraDeepSleep()
                          }.start()
                      }
                  }
              }

              companion object {
                  fun scheduleDeepSleep(context: Context, minutes: Int) {
                      val alarmManager = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                      val intent = Intent(context, SleepReceiver::class.java).apply {
                          action = "ACTION_TRIGGER_DEEP_SLEEP"
                      }
                      val pendingIntent = PendingIntent.getBroadcast(
                          context, 101, intent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )
                      val triggerTime = System.currentTimeMillis() + (minutes * 60 * 1000L)

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S && !alarmManager.canScheduleExactAlarms()) {
                          alarmManager.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerTime, pendingIntent)
                      } else {
                          alarmManager.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerTime, pendingIntent)
                      }
                  }

                  fun cancelDeepSleep(context: Context) {
                      val alarmManager = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                      val intent = Intent(context, SleepReceiver::class.java).apply {
                          action = "ACTION_TRIGGER_DEEP_SLEEP"
                      }
                      val pendingIntent = PendingIntent.getBroadcast(
                          context, 101, intent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )
                      alarmManager.cancel(pendingIntent)
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/abhishek/cpumaster/MainActivity.kt
          package com.abhishek.cpumaster

          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.rounded.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import rikka.shizuku.Shizuku
          import kotlin.math.roundToInt

          class MainActivity : ComponentActivity() {

              private val screenReceiver = SleepReceiver()
              private val shizukuPermissionListener = Shizuku.OnRequestPermissionResultListener { _, grantResult ->
                  if (grantResult == PackageManager.PERMISSION_GRANTED) {
                      Toast.makeText(this, "Shizuku Permission Granted!", Toast.LENGTH_SHORT).show()
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  Shizuku.addRequestPermissionResultListener(shizukuPermissionListener)

                  val filter = IntentFilter().apply {
                      addAction(Intent.ACTION_SCREEN_OFF)
                      addAction(Intent.ACTION_SCREEN_ON)
                      addAction(Intent.ACTION_USER_PRESENT)
                  }
                  registerReceiver(screenReceiver, filter)

                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme(
                          primary = Color(0xFF4ADE80),
                          secondary = Color(0xFF38BDF8),
                          surface = Color(0xFF1E293B),
                          background = Color(0xFF0F172A)
                      )) {
                          Surface(modifier = Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                              CpuSleepDashboard()
                          }
                      }
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  Shizuku.removeRequestPermissionResultListener(shizukuPermissionListener)
                  unregisterReceiver(screenReceiver)
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun CpuSleepDashboard() {
              val context = LocalContext.current
              val prefs = remember { context.getSharedPreferences("cpu_backup", Context.MODE_PRIVATE) }

              var mode by remember { mutableStateOf(ShellExecutor.getAvailableMode()) }
              var minFreq by remember { mutableStateOf(300000L) }
              var maxFreq by remember { mutableStateOf(2400000L) }
              var backupFreq by remember { mutableStateOf(2400000L) }
              var sliderFreq by remember { mutableFloatStateOf(2400000f) }

              val timeOptions = listOf(10, 15, 20, 30, 60, 120, 180)
              val timeLabels = listOf("10 Min", "15 Min", "20 Min", "30 Min", "1 Hour", "2 Hours", "3 Hours")

              var isSleepEnabled by remember { mutableStateOf(prefs.getBoolean("sleep_enabled", false)) }
              var selectedTimeIndex by remember {
                  val savedMins = prefs.getInt("sleep_delay_mins", 10)
                  val idx = timeOptions.indexOf(savedMins).coerceAtLeast(0)
                  mutableIntStateOf(idx)
              }
              var showTipsDialog by remember { mutableStateOf(false) }

              LaunchedEffect(Unit) {
                  mode = ShellExecutor.getAvailableMode()
                  if (mode != ShellExecutor.Mode.NONE) {
                      ShellExecutor.backupDefaultsIfNeeded(context)
                      val (min, max) = ShellExecutor.getCpuInfo()
                      minFreq = min
                      maxFreq = max
                      backupFreq = prefs.getLong("default_max", max)
                      sliderFreq = ShellExecutor.getCurrentScalingMax().toFloat().coerceIn(min.toFloat(), max.toFloat())
                  }
              }

              Scaffold(
                  topBar = {
                      TopAppBar(
                          title = {
                              Column {
                                  Text("CPU & Sleep Pro", fontWeight = FontWeight.Bold, fontSize = 20.sp)
                                  Text(
                                      text = when (mode) {
                                          ShellExecutor.Mode.ROOT -> "● Root Mode Active"
                                          ShellExecutor.Mode.SHIZUKU -> "● Shizuku Mode Active"
                                          ShellExecutor.Mode.NONE -> "● Permission Required"
                                      },
                                      fontSize =
