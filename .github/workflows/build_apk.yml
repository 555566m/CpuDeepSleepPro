                                      ShellExecutor.Mode.ROOT -> "● Root Active"
                                      ShellExecutor.Mode.SHIZUKU -> "● Shizuku Active"
                                      ShellExecutor.Mode.NONE -> "● Permission Needed"
                                  },
                                  fontSize = 12.sp,
                                  color = if (mode == ShellExecutor.Mode.NONE) Color(0xFFF87171) else Color(0xFF4ADE80)
                              )
                          }
                      },
                      actions = { IconButton(onClick = { showTips = true }) { Icon(Icons.Rounded.HelpOutline, null, tint = Color(0xFF38BDF8)) } },
                      colors = TopAppBarDefaults.topAppBarColors(containerColor = Color(0xFF0F172A))
                  )
              }) { padding ->
                  Column(Modifier.padding(padding).padding(16.dp).verticalScroll(rememberScrollState()), verticalArrangement = Arrangement.spacedBy(16.dp)) {
                      if (mode == ShellExecutor.Mode.NONE) {
                          Card(colors = CardDefaults.cardColors(containerColor = Color(0xFF7F1D1D)), shape = RoundedCornerShape(16.dp)) {
                              Column(Modifier.padding(16.dp)) {
                                  Text("Root ya Shizuku Connect Karein", fontWeight = FontWeight.Bold, color = Color.White)
                                  Spacer(Modifier.height(6.dp))
                                  Button(onClick = {
                                      if (Shizuku.pingBinder()) Shizuku.requestPermission(100)
                                      else Toast.makeText(context, "Pehle Shizuku App chalu karein!", Toast.LENGTH_SHORT).show()
                                      mode = ShellExecutor.getAvailableMode()
                                  }, colors = ButtonDefaults.buttonColors(containerColor = Color.White, contentColor = Color.Black)) {
                                      Text("Grant Shizuku / Refresh")
                                  }
                              }
                          }
                      }

                      Card(colors = CardDefaults.cardColors(containerColor = Color(0xFF1E293B)), shape = RoundedCornerShape(20.dp)) {
                          Column(Modifier.padding(18.dp)) {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Icon(Icons.Rounded.Speed, null, tint = Color(0xFF4ADE80))
                                  Spacer(Modifier.width(8.dp))
                                  Text("CPU Max Frequency", fontWeight = FontWeight.Bold, fontSize = 17.sp, color = Color.White)
                              }
                              Spacer(Modifier.height(12.dp))
                              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.Bottom) {
                                  Text("${(sliderFreq / 1000).roundToInt()} MHz", fontSize = 28.sp, fontWeight = FontWeight.ExtraBold, color = Color(0xFF4ADE80))
                                  Text("Backup: ${backupFreq / 1000} MHz", fontSize = 12.sp, color = Color(0xFF94A3B8))
                              }
                              Slider(value = sliderFreq, onValueChange = { sliderFreq =
